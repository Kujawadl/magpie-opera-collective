title: Magpie Opera Collective
url: "https://magpieopera.org"
theme: minima
future: true
timezone: US/Central
collections:
  artists:
    output: true
  events:
    output: true
    permalink: /:collection/:name

# The event-details layout splits each event's content into two parts on
# <!--more--> -- the excerpt (subtitle + tickets button, shown above the
# Details/Cast tabs) and everything after it (shown inside the Details tab).
# Every event needs this set for that split to work correctly; defaulted here
# so new events pick it up automatically instead of repeating it per-file.
defaults:
  - scope:
      path: ""
      type: events
    values:
      excerpt_separator: "<!--more-->"

artist_categories:
 - Soprani
 - Mezzo-Soprani
 - Tenors
 - Baritones
 - Accompanists
 - Crew
 - Webster's Opera Studio
socials:
  - link: https://www.instagram.com/magpieoperacollective/
    title: Instagram
    icon: fa-brands fa-instagram
  - link: https://www.youtube.com/channel/UCGuMQmoHRKFLEjaZL7BmKPg
    title: YouTube
    icon: fa-brands fa-youtube
  - link: mailto:magpieoperacollective@gmail.com
    title: Email Us
    icon: fa-solid fa-envelope